name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # No test suite yet; this catches syntax errors in the backend.
      - name: Compile Python sources
        run: python -m compileall -q main.py schemas.py
